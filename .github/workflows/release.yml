name: Release Obsidian plugin

# Actions -> Release Obsidian plugin -> "Run workflow" on master.
# Bumps the version, runs `npm run ci`, commits, tags and publishes the
# release BRAT installs from (main.js + manifest.json as assets).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to release anything but master
        if: github.ref != 'refs/heads/master'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Releases run from master, not $REF."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # `npm version` runs the `version` script, which copies the new version
      # into manifest.json and versions.json and stages them.
      - name: Bump the version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version --no-git-tag-version "$BUMP"
          git add package.json package-lock.json
          echo "tag=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Check, build and test
        run: npm run ci

      - name: Commit and tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Release $TAG"
          git tag "$TAG"
          git push origin HEAD:master "refs/tags/$TAG"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title="$TAG" \
            --generate-notes \
            main.js manifest.json
